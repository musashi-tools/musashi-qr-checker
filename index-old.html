<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR照合アプリ</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        textarea {
            width: 100%;
            max-width: 600px;
            height: 70px;
            font-size: 18px;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 18px;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            max-width: 600px;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #999;
        }

        .ok {
            background-color: #d8f5d0;
            border-color: green;
        }

        .ng {
            background-color: #ffd6d6;
            border-color: red;
        }

        .error {
            background-color: #fff3cd;
            border-color: orange;
        }
    </style>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <h1>QR照合アプリ（試作版）</h1>

    <p>納品済み薬QR</p>
    <textarea id="qr1"></textarea>

    <p>臨時薬QR</p>
    <textarea id="qr2"></textarea>

    <br>

    <button onclick="startScan1()">
    納品済み薬を読み取る
    </button>

    <button onclick="startScan2()">
    臨時薬を読み取る
    </button>

    <br><br>    

    <button onclick="checkQr()">照合する</button>

    <br><br>  

<div id="reader" style="width:350px;"></div>

<div id="result">
    ここに照合結果が表示されます
</div>

    <div id="result">
        ここに照合結果が表示されます
    </div>

    <script>
        function parseQr(qrText) {
            const items = qrText.trim().split(",");

            if (items.length !== 4) {
                return null;
            }

            return {
                patientId: items[0].trim(),
                date: items[1].trim(),
                usageCode: items[2].trim(),
                machineId: items[3].trim()
            };
        }

        function checkQr() {
            const qr1Text = document.getElementById("qr1").value;
            const qr2Text = document.getElementById("qr2").value;
            const result = document.getElementById("result");

            result.className = "";

            const qr1 = parseQr(qr1Text);
            const qr2 = parseQr(qr2Text);

            if (qr1 === null || qr2 === null) {
                result.className = "error";
                result.innerHTML =
                    "QR形式エラー<br>" +
                    "カンマ区切りで4項目あるか確認してください。";
                return;
            }

            const patientMatch = qr1.patientId === qr2.patientId;
            const dateMatch = qr1.date === qr2.date;
            const usageMatch = qr1.usageCode === qr2.usageCode;

            if (patientMatch && dateMatch && usageMatch) {
                result.className = "ok";
                result.innerHTML =
                    "照合OK<br><br>" +
                    "患者ID：一致<br>" +
                    "服用日：一致<br>" +
                    "用法：一致";
            } else {
                result.className = "ng";

                let message = "照合NG<br><br>";

                message += patientMatch
                    ? "患者ID：一致<br>"
                    : "患者ID：不一致<br>";

                message += dateMatch
                    ? "服用日：一致<br>"
                    : "服用日：不一致<br>";

                message += usageMatch
                    ? "用法：一致<br>"
                    : "用法：不一致<br>";

                result.innerHTML = message;
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR照合アプリ</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: sans-serif;
            background: #f3f4f6;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            margin: 8px 0 20px;
            text-align: center;
            font-size: 28px;
        }

        .card {
            margin-bottom: 16px;
            padding: 18px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .card h2 {
            margin-top: 0;
            font-size: 21px;
        }

        button {
            width: 100%;
            min-height: 58px;
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .scan-button {
            background: #1565c0;
            color: white;
        }

        .check-button {
            background: #333;
            color: white;
        }

        .reset-button {
            background: #ddd;
            color: #222;
        }

        .read-status {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: #eee;
            font-size: 16px;
        }

        .read-complete {
            background: #dff4e2;
        }

        #reader {
            display: none;
            width: 100%;
            margin: 16px 0;
            overflow: hidden;
            border-radius: 12px;
            background: black;
        }

        #scanGuide {
            display: none;
            margin: 10px 0;
            padding: 12px;
            text-align: center;
            background: #fff3cd;
            border-radius: 8px;
            font-weight: bold;
        }

        #result {
            display: none;
            margin-top: 18px;
            padding: 24px 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        #result.ok {
            display: block;
            color: #125d20;
            background: #d9f5df;
            border: 4px solid #218838;
        }

        #result.ng {
            display: block;
            color: #82151d;
            background: #ffd9dc;
            border: 4px solid #dc3545;
        }

        #result.error {
            display: block;
            color: #664d03;
            background: #fff3cd;
            border: 4px solid #ffca2c;
        }

        .result-title {
            margin-bottom: 16px;
            font-size: 34px;
        }

        .comparison {
            margin-top: 12px;
            line-height: 1.8;
            text-align: left;
        }

        .hidden-data {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>QR照合アプリ</h1>

    <div class="card">
        <h2>① 納品済み薬</h2>

        <button class="scan-button" onclick="startScan('qr1')">
            納品済み薬を読み取る
        </button>

        <div id="status1" class="read-status">
            未読取
        </div>

        <textarea id="qr1" class="hidden-data"></textarea>
    </div>

    <div class="card">
        <h2>② 臨時薬</h2>

        <button class="scan-button" onclick="startScan('qr2')">
            臨時薬を読み取る
        </button>

        <div id="status2" class="read-status">
            未読取
        </div>

        <textarea id="qr2" class="hidden-data"></textarea>
    </div>

    <div id="scanGuide">
        QRコードを枠内に写してください
    </div>

    <div id="reader"></div>

    <button class="check-button" onclick="checkQr()">
        照合する
    </button>

    <div id="result"></div>

    <button class="reset-button" onclick="resetAll()">
        最初からやり直す
    </button>

</div>

<script>
    let scanner = null;
    let currentTarget = "";

    function parseQr(qrText) {
        const items = qrText.trim().split(",");

        if (items.length !== 4) {
            return null;
        }

        const patientId = items[0].trim();
        const date = items[1].trim();
        const usageCode = items[2].trim();
        const machineId = items[3].trim();

        if (
            patientId === "" ||
            date === "" ||
            usageCode === "" ||
            machineId === ""
        ) {
            return null;
        }

        return {
            patientId: patientId,
            date: date,
            usageCode: usageCode,
            machineId: machineId
        };
    }

async function startScan(targetId) {
    currentTarget = targetId;

    const reader = document.getElementById("reader");
    const scanGuide = document.getElementById("scanGuide");

    reader.style.display = "block";
    scanGuide.style.display = "block";

    if (scanner !== null) {
        try {
            await scanner.stop();
        } catch (error) {
            console.log(error);
        }

        scanner.clear();
        scanner = null;
    }

    scanner = new Html5Qrcode("reader", {
        formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
        ],
        verbose: false
    });

    try {
        await scanner.start(
            {
                facingMode: "environment"
            },
            {
                fps: 15,
                aspectRatio: 1.777778,

                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    const size = Math.floor(
                        Math.min(viewfinderWidth, viewfinderHeight) * 0.9
                    );

                    return {
                        width: size,
                        height: size
                    };
                },

                videoConstraints: {
                    facingMode: "environment",
                    width: {
                        ideal: 1920
                    },
                    height: {
                        ideal: 1080
                    }
                }
            },

            async function(decodedText) {
                document.getElementById(currentTarget).value = decodedText;

                const parsed = parseQr(decodedText);

                if (currentTarget === "qr1") {
                    updateReadStatus("status1", parsed);
                } else {
                    updateReadStatus("status2", parsed);
                }

                try {
                    await scanner.stop();
                } catch (error) {
                    console.log(error);
                }

                scanner.clear();
                scanner = null;

                reader.style.display = "none";
                scanGuide.style.display = "none";
            },

            function(errorMessage) {
                // QRコードを探している途中のエラーは表示しない
            }
        );

        // 端末がズームに対応している場合、自動で約2倍にする
        try {
            const capabilities =
                scanner.getRunningTrackCapabilities();

            if (
                capabilities.zoom &&
                capabilities.zoom.max > capabilities.zoom.min
            ) {
                const zoomValue = Math.min(
                    2,
                    capabilities.zoom.max
                );

                await scanner.applyVideoConstraints({
                    advanced: [
                        {
                            zoom: zoomValue
                        }
                    ]
                });
            }
        } catch (zoomError) {
            // ズーム非対応端末では何もしない
            console.log("ズーム非対応:", zoomError);
        }

    } catch (error) {
        reader.style.display = "none";
        scanGuide.style.display = "none";

        showError(
            "カメラを起動できませんでした。<br>" +
            "ChromeまたはSafariで開き、" +
            "カメラの使用を許可してください。"
        );

        console.error(error);
    }
}

    function updateReadStatus(statusId, parsed) {
        const status = document.getElementById(statusId);

        if (parsed === null) {
            status.className = "read-status";
            status.innerHTML = "QR形式エラー";
            return;
        }

        const maskedId =
            "******" + parsed.patientId.slice(-4);

        status.className = "read-status read-complete";
        status.innerHTML =
            "読取完了<br>" +
            "患者ID：" + maskedId + "<br>" +
            "服用日：" + parsed.date + "<br>" +
            "用法コード：" + parsed.usageCode;
    }

    function checkQr() {
        const qr1Text = document.getElementById("qr1").value;
        const qr2Text = document.getElementById("qr2").value;

        if (qr1Text.trim() === "" || qr2Text.trim() === "") {
            showError(
                "2つのQRコードを読み取ってから照合してください。"
            );
            return;
        }

        const qr1 = parseQr(qr1Text);
        const qr2 = parseQr(qr2Text);

        if (qr1 === null || qr2 === null) {
            showError(
                "QR形式エラー<br>" +
                "想定した分包紙のQRコードか確認してください。"
            );
            return;
        }

        const patientMatch =
            qr1.patientId === qr2.patientId;

        const dateMatch =
            qr1.date === qr2.date;

        const usageMatch =
            qr1.usageCode === qr2.usageCode;

        const result = document.getElementById("result");

        if (patientMatch && dateMatch && usageMatch) {
            result.className = "ok";

            result.innerHTML =
                '<div class="result-title">照合OK</div>' +
                "ホチキス止め可能です。<br><br>" +
                "患者ID：一致<br>" +
                "服用日：一致<br>" +
                "用法：一致";
        } else {
            result.className = "ng";

            result.innerHTML =
                '<div class="result-title">照合NG</div>' +
                "ホチキス止めしないでください。" +
                '<div class="comparison">' +
                "患者ID：" +
                (patientMatch ? "一致" : "不一致") +
                "<br>" +
                "服用日：" +
                (dateMatch ? "一致" : "不一致") +
                "<br>" +
                "用法：" +
                (usageMatch ? "一致" : "不一致") +
                "</div>";
        }
    }

    function showError(message) {
        const result = document.getElementById("result");

        result.className = "error";
        result.innerHTML =
            '<div class="result-title">確認してください</div>' +
            message;
    }

    async function resetAll() {
        if (scanner !== null) {
            try {
                await scanner.stop();
            } catch (error) {
                console.log(error);
            }

            scanner.clear();
            scanner = null;
        }

        document.getElementById("qr1").value = "";
        document.getElementById("qr2").value = "";

        document.getElementById("status1").className =
            "read-status";

        document.getElementById("status1").innerHTML =
            "未読取";

        document.getElementById("status2").className =
            "read-status";

        document.getElementById("status2").innerHTML =
            "未読取";

        document.getElementById("reader").style.display =
            "none";

        document.getElementById("scanGuide").style.display =
            "none";

        const result = document.getElementById("result");

        result.className = "";
        result.innerHTML = "";
    }
</script>

</body>
</html>

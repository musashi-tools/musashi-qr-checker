<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR照合アプリ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            background: #f3f4f6;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 28px;
        }

        .description {
            margin: 0 0 24px;
            text-align: center;
            color: #555;
            font-size: 14px;
        }

        .mode-link {
            display: block;
            margin-bottom: 16px;
            padding: 22px 16px;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
        }

        .mode-title {
            display: block;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: bold;
        }

        .mode-description {
            display: block;
            font-size: 15px;
            line-height: 1.5;
        }

        .pharmacy-mode {
            background: #198754;
        }

        .onsite-mode {
            background: #1565c0;
        }

        .test-mode {
            background: #6f42c1;
        }

        .version {
            margin-top: 24px;
            text-align: center;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>QR照合アプリ</h1>

    <p class="description">
        使用するモードを選択してください
    </p>

    <a class="mode-link pharmacy-mode" href="pharmacy.html">
        <span class="mode-title">
            薬局モード
        </span>

        <span class="mode-description">
            ケースセット前の最終チェック
        </span>
    </a>

    <a class="mode-link onsite-mode" href="onsite.html">
        <span class="mode-title">
            現地作業モード
        </span>

        <span class="mode-description">
            臨時薬のホチキス止め照合
        </span>
    </a>

    <a class="mode-link test-mode" href="test.html">
        <span class="mode-title">
            テストモード
        </span>

        <span class="mode-description">
            写真からQRコードを読み取る検証
        </span>
    </a>

    <div class="version">
        試作版
    </div>

</div>

</body>
</html>

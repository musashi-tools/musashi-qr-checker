<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薬局モード</title>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 8px;
            font-family: sans-serif;
            background: #f3f4f6;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .home-link {
            display: block;
            margin-bottom: 6px;
            color: #555;
            text-align: center;
            font-size: 13px;
            text-decoration: none;
        }

        h1 {
            margin: 2px 0 8px;
            color: #198754;
            text-align: center;
            font-size: 22px;
        }

        .phase {
            margin-bottom: 8px;
            padding: 10px;
            text-align: center;
            background: #fff;
            border: 2px solid #198754;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .summary-card {
            min-width: 0;
            padding: 8px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }

        .summary-card h2 {
            margin: 0 0 5px;
            text-align: center;
            font-size: 15px;
        }

        .summary-line {
            overflow: hidden;
            margin: 3px 0;
            font-size: 12px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #reader {
            display: none;
            width: 260px;
            height: 260px;
            max-width: 85vw;
            max-height: 85vw;
            margin: 8px auto;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        button {
            width: 100%;
            min-height: 44px;
            margin-top: 6px;
            padding: 9px;
            border: 0;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-button { background: #198754; color: #fff; }
        .reset-button { background: #ddd; color: #222; }

        #message,
        #result {
            margin-top: 8px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        #message { background: #fff3cd; color: #664d03; }
        #result { display: none; }

        #result.ok {
            display: block;
            color: #125d20;
            background: #d9f5df;
            border: 4px solid #218838;
        }

        #result.ng {
            display: block;
            color: #82151d;
            background: #ffd9dc;
            border: 4px solid #dc3545;
        }

        #result.warning {
            display: block;
            color: #664d03;
            background: #fff3cd;
            border: 4px solid #ffca2c;
        }

        .result-title {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .comparison {
            margin-top: 8px;
            line-height: 1.7;
            text-align: left;
        }
    </style>
</head>

<body>
<div class="container">
    <a class="home-link" href="index.html">← モード選択へ戻る</a>
    <h1>薬局モード</h1>

    <div id="phase" class="phase">開始待ち</div>

    <div class="summary-grid">
        <div class="summary-card">
            <h2>初日</h2>
            <div id="firstDate" class="summary-line">日付：未読取</div>
            <div id="firstCount" class="summary-line">包数：0包</div>
        </div>

        <div class="summary-card">
            <h2>最終日</h2>
            <div id="lastDate" class="summary-line">日付：未読取</div>
            <div id="lastCount" class="summary-line">包数：0包</div>
        </div>
    </div>

    <button id="startButton" class="start-button" onclick="startContinuousScan()">
        チェック開始
    </button>

    <div id="reader"></div>

    <div id="message">
        「チェック開始」を押し、初日の薬包を読み取ってください。
    </div>

    <div id="result"></div>

    <button class="reset-button" onclick="resetAll()">
        最初からやり直す
    </button>
</div>

<script>
    const COMMAND_FIRST_DAY_END = "MUSASHI:PHARMACY:FIRST_DAY_END";
    const COMMAND_USAGE_END = "MUSASHI:PHARMACY:USAGE_END";

    let scanner = null;
    let phase = "idle"; // idle / first / last / completed / error
    let firstBase = null;
    let lastBase = null;
    let firstCount = 0;
    let lastCount = 0;
    let lastDecodedText = "";
    let lastDecodedAt = 0;
    let processing = false;

    function parseQr(qrText) {
        const text = qrText.trim();

        if (text === COMMAND_FIRST_DAY_END) {
            return { type: "command", command: "FIRST_DAY_END" };
        }

        if (text === COMMAND_USAGE_END) {
            return { type: "command", command: "USAGE_END" };
        }

        const items = text.split(",").map(function(item) {
            return item.trim();
        });

        if (items.length === 4) {
            if (items[0] === "" || items[1] === "" || items[2] === "") {
                return null;
            }

            return {
                type: "pharmacy",
                typeName: "分包紙",
                patientId: items[0],
                date: items[1],
                usageCode: items[2]
            };
        }

        if (items.length === 5) {
            if (items[0] === "" || items[1] === "" || items[2] === "") {
                return null;
            }

            return {
                type: "fukuyakkun",
                typeName: "服やっくん",
                patientId: items[0],
                date: items[1],
                usageCode: items[2]
            };
        }

        return null;
    }

    function sameMedication(a, b) {
        return (
            a.type === b.type &&
            a.patientId === b.patientId &&
            a.date === b.date &&
            a.usageCode === b.usageCode
        );
    }

    function setMessage(text) {
        document.getElementById("message").textContent = text;
    }

    function setPhase(text) {
        document.getElementById("phase").textContent = text;
    }

    function updateSummary() {
        document.getElementById("firstDate").textContent =
            "日付：" + (firstBase ? firstBase.date : "未読取");

        document.getElementById("firstCount").textContent =
            "包数：" + firstCount + "包";

        document.getElementById("lastDate").textContent =
            "日付：" + (lastBase ? lastBase.date : "未読取");

        document.getElementById("lastCount").textContent =
            "包数：" + lastCount + "包";
    }

    function showError(title, detail) {
        phase = "error";
        setPhase("エラー停止");

        const result = document.getElementById("result");
        result.className = "ng";
        result.innerHTML =
            '<div class="result-title">' + title + "</div>" +
            detail;

        setMessage("内容を確認し、『最初からやり直す』を押してください。");
        stopScanner();
    }

    function handleMedication(parsed) {
        // 最終日の結果表示後、次の薬包を読んだら新しい用法を開始
        if (phase === "completed") {
            clearSession(true);
            phase = "first";
        }

        // 初日の結果表示後、最終日の1包目を読んだら結果表示を消す
        if (phase === "last" && lastBase === null) {
            clearResult();
        }

        if (phase === "idle") {
            phase = "first";
        }

        if (phase === "first") {
            if (firstBase === null) {
                firstBase = parsed;
                firstCount = 1;
                setPhase("初日チェック中");
                setMessage("初日の残りを読み、最後に『初日終了QR』を読み取ってください。");
                updateSummary();
                return;
            }

            if (!sameMedication(firstBase, parsed)) {
                showError(
                    "初日照合NG",
                    "初日チェック中に、患者ID・日付・用法・QR種類のいずれかが異なる薬包を検出しました。"
                );
                return;
            }

            firstCount += 1;
            updateSummary();
            setMessage("初日：" + firstCount + "包確認済み");
            return;
        }

        if (phase === "last") {
            if (lastBase === null) {
                if (parsed.type !== firstBase.type) {
                    showError("最終日照合NG", "初日とQR種類が異なります。");
                    return;
                }

                if (parsed.patientId !== firstBase.patientId) {
                    showError("最終日照合NG", "初日と患者IDが異なります。");
                    return;
                }

                if (parsed.usageCode !== firstBase.usageCode) {
                    showError("最終日照合NG", "初日と用法が異なります。");
                    return;
                }

                const firstTime = Date.parse(firstBase.date);
                const lastTime = Date.parse(parsed.date);

                if (
                    Number.isNaN(firstTime) ||
                    Number.isNaN(lastTime) ||
                    lastTime <= firstTime
                ) {
                    showError("最終日照合NG", "最終日の日付が初日より後ではありません。");
                    return;
                }

                lastBase = parsed;
                lastCount = 1;
                setPhase("最終日チェック中");
                setMessage("最終日の残りを読み、最後に『用法終了QR』を読み取ってください。");
                updateSummary();
                return;
            }

            if (!sameMedication(lastBase, parsed)) {
                showError(
                    "最終日照合NG",
                    "最終日チェック中に、患者ID・日付・用法・QR種類のいずれかが異なる薬包を検出しました。"
                );
                return;
            }

            lastCount += 1;
            updateSummary();
            setMessage("最終日：" + lastCount + "包確認済み");
        }
    }

    function handleCommand(command) {
        if (command === "FIRST_DAY_END") {
            if (phase !== "first" || firstCount === 0) {
                showError("区切りQRエラー", "初日の薬包を1包以上読んでから使用してください。");
                return;
            }

            showFirstDayResult();
            phase = "last";
            setPhase("最終日待ち");
            setMessage("初日の確認は正常です。最終日の1包目を読み取ってください。");
            return;
        }

        if (command === "USAGE_END") {
            if (phase !== "last" || lastCount === 0) {
                showError("区切りQRエラー", "最終日の薬包を1包以上読んでから使用してください。");
                return;
            }

            showLastDayResult();
        }
    }

    function showFirstDayResult() {
        const result = document.getElementById("result");

        result.className = "ok";
        result.innerHTML =
            '<div class="result-title">初日 照合OK</div>' +
            '<div class="comparison">' +
            "QR種類：" + firstBase.typeName + "<br>" +
            "患者ID：******" + firstBase.patientId.slice(-4) + "<br>" +
            "用法：" + firstBase.usageCode + "<br>" +
            "日付：" + firstBase.date + "<br>" +
            "確認包数：" + firstCount + "包" +
            "</div>";
    }

    function showLastDayResult() {
        const result = document.getElementById("result");

        if (firstCount !== lastCount) {
            phase = "error";
            setPhase("照合NG");
            result.className = "ng";
            result.innerHTML =
                '<div class="result-title">最終日 照合NG</div>' +
                "初日と最終日の包数が一致しません。" +
                '<div class="comparison">' +
                "初日：" + firstBase.date + "　" + firstCount + "包<br>" +
                "最終日：" + lastBase.date + "　" + lastCount + "包" +
                "</div>";

            setMessage("ホチ止め内容を確認してください。");
            stopScanner();
            return;
        }

        phase = "completed";
        setPhase("次の用法待ち");
        result.className = "ok";
        result.innerHTML =
            '<div class="result-title">最終日 照合OK</div>' +
            '<div class="comparison">' +
            "QR種類：" + lastBase.typeName + "<br>" +
            "患者ID：******" + lastBase.patientId.slice(-4) + "<br>" +
            "用法：" + lastBase.usageCode + "<br>" +
            "日付：" + lastBase.date + "<br>" +
            "確認包数：" + lastCount + "包<br>" +
            "初日との包数：一致" +
            "</div>";

        setMessage("次の用法の1包目を読み取ると、結果表示を消して新しいチェックを開始します。");
    }

    async function processDecodedText(decodedText) {
        if (processing || phase === "error") {
            return;
        }

        const now = Date.now();

        // 同じQRを置いたままにした際の連続カウントを抑止
        if (decodedText === lastDecodedText && now - lastDecodedAt < 1500) {
            return;
        }

        processing = true;
        lastDecodedText = decodedText;
        lastDecodedAt = now;

        try {
            const parsed = parseQr(decodedText);

            if (parsed === null) {
                showError("QR形式エラー", "対応していないQRコードです。");
                return;
            }

            if (parsed.type === "command") {
                handleCommand(parsed.command);
            } else {
                handleMedication(parsed);
            }
        } finally {
            setTimeout(function() {
                processing = false;
            }, 500);
        }
    }

    async function startContinuousScan() {
        if (scanner !== null) {
            return;
        }

        document.getElementById("startButton").style.display = "none";
        document.getElementById("reader").style.display = "block";

        if (phase === "idle") {
            setPhase("初日待ち");
            setMessage("初日の1包目を読み取ってください。");
        }

        scanner = new Html5Qrcode("reader", {
            formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true
            },
            verbose: false
        });

        try {
            await scanner.start(
                { facingMode: "environment" },
                {
                    fps: 20,
                    aspectRatio: 1.0,
                    qrbox: function(viewfinderWidth, viewfinderHeight) {
                        const size = Math.floor(
                            Math.min(viewfinderWidth, viewfinderHeight) * 0.78
                        );

                        return { width: size, height: size };
                    },
                    videoConstraints: {
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                },
                function(decodedText) {
                    processDecodedText(decodedText);
                },
                function() {
                    // 読取途中のエラーは表示しない
                }
            );

            try {
                const capabilities = scanner.getRunningTrackCapabilities();
                const advancedSettings = {};

                if (
                    Array.isArray(capabilities.focusMode) &&
                    capabilities.focusMode.includes("continuous")
                ) {
                    advancedSettings.focusMode = "continuous";
                }

                if (
                    capabilities.zoom &&
                    typeof capabilities.zoom.max === "number"
                ) {
                    advancedSettings.zoom = Math.min(2.5, capabilities.zoom.max);
                }

                if (Object.keys(advancedSettings).length > 0) {
                    await scanner.applyVideoConstraints({
                        advanced: [advancedSettings]
                    });
                }
            } catch (cameraSettingError) {
                console.log("追加カメラ設定は非対応:", cameraSettingError);
            }
        } catch (error) {
            document.getElementById("reader").style.display = "none";
            document.getElementById("startButton").style.display = "block";
            scanner = null;

            showError(
                "カメラ起動エラー",
                "ChromeまたはSafariで開き、カメラの使用を許可してください。"
            );

            console.error(error);
        }
    }

    async function stopScanner() {
        if (scanner === null) {
            return;
        }

        try {
            await scanner.stop();
        } catch (error) {
            console.log(error);
        }

        try {
            scanner.clear();
        } catch (error) {
            console.log(error);
        }

        scanner = null;
        document.getElementById("reader").style.display = "none";
        document.getElementById("startButton").style.display = "block";
    }

    function clearResult() {
        const result = document.getElementById("result");
        result.className = "";
        result.innerHTML = "";
    }

    function clearSession(clearResultDisplay) {
        firstBase = null;
        lastBase = null;
        firstCount = 0;
        lastCount = 0;
        lastDecodedText = "";
        lastDecodedAt = 0;
        updateSummary();

        if (clearResultDisplay) {
            clearResult();
        }
    }

    async function resetAll() {
        await stopScanner();
        clearSession(true);
        phase = "idle";
        processing = false;
        setPhase("開始待ち");
        setMessage("『チェック開始』を押し、初日の薬包を読み取ってください。");
    }
</script>
</body>
</html>

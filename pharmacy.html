<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>薬局モード</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            background: #f3f4f6;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 32px 20px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.14);
        }

        h1 {
            margin: 0 0 20px;
            color: #198754;
            font-size: 28px;
        }

        .message {
            margin-bottom: 28px;
            font-size: 20px;
            font-weight: bold;
        }

        .sub-message {
            margin-bottom: 28px;
            color: #666;
            font-size: 15px;
            line-height: 1.6;
        }

        .back-button {
            display: block;
            width: 100%;
            padding: 14px;
            color: white;
            text-decoration: none;
            background: #555;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>薬局モード</h1>

    <div class="message">
        現在作成中です
    </div>

    <div class="sub-message">
        ケースセット前の最終チェック機能を<br>
        今後追加する予定です。
    </div>

    <a class="back-button" href="index.html">
        モード選択へ戻る
    </a>

</div>

</body>
</html>

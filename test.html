<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写真QRテストモード</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 12px;
            font-family: sans-serif;
            background: #f3f4f6;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }

        .home-link {
            display: block;
            margin-bottom: 8px;
            color: #555;
            text-align: center;
            font-size: 13px;
            text-decoration: none;
        }

        h1 {
            margin: 4px 0 8px;
            text-align: center;
            font-size: 23px;
        }

        .description {
            margin: 0 0 12px;
            color: #555;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .card {
            margin-bottom: 10px;
            padding: 12px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .file-button {
            display: block;
            width: 100%;
            padding: 13px 10px;
            color: #fff;
            text-align: center;
            background: #6f42c1;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #photoInput { display: none; }

        #preview {
            display: none;
            width: 100%;
            max-height: 55vh;
            margin-top: 10px;
            object-fit: contain;
            background: #111;
            border-radius: 8px;
        }

        #status {
            margin-top: 10px;
            padding: 10px;
            text-align: center;
            background: #eee;
            border-radius: 8px;
            font-weight: bold;
        }

        #status.ok {
            color: #125d20;
            background: #d9f5df;
        }

        #status.warning {
            color: #664d03;
            background: #fff3cd;
        }

        #status.error {
            color: #82151d;
            background: #ffd9dc;
        }

        #results { display: none; }

        .result-item {
            margin-top: 8px;
            padding: 10px;
            background: #f7f7f7;
            border-left: 5px solid #6f42c1;
            border-radius: 7px;
        }

        .result-number {
            margin-bottom: 5px;
            font-weight: bold;
        }

        .result-text {
            overflow-wrap: anywhere;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .reset-button {
            width: 100%;
            min-height: 44px;
            margin-top: 8px;
            padding: 9px;
            border: 0;
            border-radius: 9px;
            color: #222;
            background: #ddd;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .note {
            margin-top: 8px;
            color: #666;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
<div class="container">

    <a class="home-link" href="index.html">← モード選択へ戻る</a>

    <h1>写真QRテストモード</h1>

    <p class="description">
        撮影済みの写真を選び、画像内から検出できたQRコードの件数と内容を表示します。
    </p>

    <div class="card">
        <label class="file-button" for="photoInput">
            写真を選択・撮影
        </label>

        <input id="photoInput" type="file" accept="image/*">

        <img id="preview" alt="選択した写真">

        <div id="status">
            写真を選択してください
        </div>

        <div class="note">
            この第1版は、端末・ブラウザが複数QR検出機能に対応しているかを確認する検証用です。
        </div>
    </div>

    <div id="results" class="card">
        <strong>検出内容</strong>
        <div id="resultList"></div>
    </div>

    <button class="reset-button" type="button" onclick="resetTest()">
        最初からやり直す
    </button>

</div>

<script>
    const photoInput = document.getElementById("photoInput");
    const preview = document.getElementById("preview");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");
    const resultList = document.getElementById("resultList");

    let currentObjectUrl = null;

    photoInput.addEventListener("change", async function(event) {
        const file = event.target.files[0];

        if (!file) {
            return;
        }

        clearPreviousResult();

        if (currentObjectUrl !== null) {
            URL.revokeObjectURL(currentObjectUrl);
        }

        currentObjectUrl = URL.createObjectURL(file);
        preview.src = currentObjectUrl;
        preview.style.display = "block";

        setStatus("画像を解析しています…", "");

        try {
            if (!("BarcodeDetector" in window)) {
                throw new Error(
                    "このブラウザはBarcodeDetectorに対応していません。AndroidのChromeで試してください。"
                );
            }

            const supportedFormats =
                await BarcodeDetector.getSupportedFormats();

            if (!supportedFormats.includes("qr_code")) {
                throw new Error(
                    "この端末ではQRコード検出に対応していません。"
                );
            }

            await waitForImageLoad(preview);

            const detector = new BarcodeDetector({
                formats: ["qr_code"]
            });

            const detectedCodes = await detector.detect(preview);

            showDetectedCodes(detectedCodes);

        } catch (error) {
            console.error(error);
            setStatus(
                error.message || "画像の解析中にエラーが発生しました。",
                "error"
            );
        }
    });

    function waitForImageLoad(imageElement) {
        return new Promise(function(resolve, reject) {
            if (
                imageElement.complete &&
                imageElement.naturalWidth > 0
            ) {
                resolve();
                return;
            }

            imageElement.onload = function() {
                resolve();
            };

            imageElement.onerror = function() {
                reject(new Error("画像を読み込めませんでした。"));
            };
        });
    }

    function showDetectedCodes(detectedCodes) {
        resultList.innerHTML = "";

        if (detectedCodes.length === 0) {
            resultsBox.style.display = "none";
            setStatus(
                "QRコードを検出できませんでした。撮影距離・ピント・反射を確認してください。",
                "warning"
            );
            return;
        }

        detectedCodes.forEach(function(code, index) {
            const item = document.createElement("div");
            item.className = "result-item";

            const number = document.createElement("div");
            number.className = "result-number";
            number.textContent = "QR " + (index + 1);

            const text = document.createElement("div");
            text.className = "result-text";
            text.textContent = code.rawValue;

            item.appendChild(number);
            item.appendChild(text);
            resultList.appendChild(item);
        });

        resultsBox.style.display = "block";

        const statusClass =
            detectedCodes.length === 2 ? "ok" : "warning";

        const message =
            "QRコードを " +
            detectedCodes.length +
            "個検出しました。" +
            (
                detectedCodes.length === 2
                    ? " 目標の2個を検出できています。"
                    : " 今回は件数確認のみ行ってください。"
            );

        setStatus(message, statusClass);
    }

    function setStatus(message, className) {
        statusBox.textContent = message;
        statusBox.className = className;
    }

    function clearPreviousResult() {
        resultList.innerHTML = "";
        resultsBox.style.display = "none";
    }

    function resetTest() {
        photoInput.value = "";
        preview.removeAttribute("src");
        preview.style.display = "none";

        if (currentObjectUrl !== null) {
            URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = null;
        }

        clearPreviousResult();
        setStatus("写真を選択してください", "");
    }
</script>
</body>
</html>
